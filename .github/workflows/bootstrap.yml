name: Bootstrap repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, 'run repository bootstrap')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract repository bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/areademembrosNW.tar.gz
          tar -xzf /tmp/areademembrosNW.tar.gz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Validate materialized source
        shell: bash
        run: |
          npm install
          npm run validate

      - name: Commit materialized repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize Nutriwork members-area source"
          git push
